version: '3.8'

volumes:
  postgres_data:
  qdrant_data:

services:
  db:
    image: postgres:15
    container_name: soc_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=soc_user
      - POSTGRES_PASSWORD=soc_password
      - POSTGRES_DB=soc_db
    ports:
      # Expose on 5433 to avoid port clashes if PostgreSQL is already running locally on 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user -d soc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: soc_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    entrypoint: ["/bin/sh", "-c", "sed -i 's/\\r$$//' /app/entrypoint.sh 2>/dev/null; chmod +x /app/entrypoint.sh; exec /app/entrypoint.sh"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://soc_user:soc_password@db:5432/soc_db
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=security_knowledge
      - WAZUH_MODE=mock
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen3:8b
      - LLM_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_PROVIDER=semantic
      - CORS_ORIGINS=http://localhost:5173,http://localhost:4173,http://localhost:8000,http://127.0.0.1:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
